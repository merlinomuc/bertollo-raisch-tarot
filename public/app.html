<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#f7f0ff;background:#0d0814;line-height:1.5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#432568 0,#181022 46%,#09060e 100%)}button,input,textarea{font:inherit}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:clamp(24px,5vw,42px)/1.1 Georgia,serif}.sub{color:#cdbdde;font-size:13px}.home{border:1px solid #765b91;background:#251837;color:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.panel{margin-top:18px;background:rgba(24,14,38,.94);border:1px solid #4e3868;border-radius:20px;padding:18px;box-shadow:0 18px 50px #0008}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.option{border:1px solid #624779;background:linear-gradient(145deg,#302044,#21152f);color:#fff;border-radius:16px;padding:18px;text-align:left;cursor:pointer;min-height:120px}.option:hover,.option:focus-visible{transform:translateY(-2px);border-color:#d2b0ef;outline:2px solid #f0d681;outline-offset:2px}.option b{display:block;font-size:17px;margin-bottom:7px}.option span{color:#cbb9dd;font-size:13px}.label{display:block;margin:13px 0 6px;color:#eadcf7;font-weight:700}textarea,input{width:100%;border:1px solid #655078;background:#120c1b;color:#fff;border-radius:11px;padding:11px}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.primary,.secondary{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:#f0d681;color:#281b05}.secondary{background:#38264d;color:#fff;border:1px solid #665078}.primary:disabled,.secondary:disabled{opacity:.5;cursor:not-allowed}.cards{display:flex;gap:12px;overflow:auto;padding:15px 2px 8px;scroll-snap-type:x mandatory}.card{flex:0 0 148px;scroll-snap-align:start;text-align:center}.card img{width:148px;height:237px;object-fit:cover;border-radius:11px;border:2px solid #a887c7;box-shadow:0 10px 24px #0008}.card-name{font-size:12px;margin-top:7px}.backs{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;margin-top:14px}.back{aspect-ratio:2/3;border-radius:9px;border:2px solid #8267a0;background:radial-gradient(circle,#64447e 0 8%,transparent 9%),linear-gradient(135deg,#221333,#53366d,#21122f);color:#fff;cursor:pointer;font-weight:800;box-shadow:inset 0 0 0 3px #1a1026}.back.selected{border-color:#f0d681;box-shadow:0 0 0 3px #f0d68155,inset 0 0 0 3px #1a1026}.notice,.safety{padding:11px 13px;border-radius:12px;background:#2b2135;color:#ddd0e8;font-size:13px}.safety{margin-top:14px;border:1px solid #59456c;background:#1c1328}.status{margin-top:12px;color:#f0d681;font-size:14px}.answer{margin-top:18px;border-top:1px solid #59456c;padding-top:18px;color:#f6effc}.answer h2,.answer h3{font-family:Georgia,serif}.reading-head{background:#21162f;border:1px solid #57406c;border-radius:14px;padding:14px;margin-bottom:12px}.reading-head h3{margin:0 0 6px}.position-reading{border-left:3px solid #a887c7;background:#171020;border-radius:0 12px 12px 0;padding:12px 14px;margin:10px 0}.position-reading h4{margin:0 0 6px;color:#f0d681}.position-reading p,.reading-section p{margin:0}.reading-section{padding:12px 0;border-bottom:1px solid #3e304c}.reading-section h3{margin:0 0 6px;font-size:20px}.essence{background:#30223d;border:1px solid #6f5682;border-radius:12px;padding:13px;font-weight:700}.followup-box{margin-top:18px;padding:15px;border:1px solid #80649a;background:#21162e;border-radius:14px}.followup-box h3{margin:0 0 8px}.followup-suggestion{color:#f0d681;font-weight:700}.followup-box textarea{min-height:72px}.followup-note{font-size:12px;color:#bba9cb;margin-top:8px}.error{color:#ffb6b6}.success{color:#baf4c8}.auth-ok{margin-top:14px;padding:12px 14px;border:1px solid #3e7650;background:#14291b;border-radius:12px;color:#c9f6d3;display:flex;justify-content:space-between;align-items:center;gap:10px}.auth-error{margin-top:10px;padding:10px 12px;border:1px solid #8e4d55;background:#32171c;border-radius:10px;color:#ffc2c7}.auth-info{margin-top:10px;color:#d9cce5;font-size:13px}.small-button{border:1px solid #5e785f;background:transparent;color:#d9efdc;border-radius:9px;padding:6px 9px;cursor:pointer;white-space:nowrap}.own-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.codebox{display:flex;gap:8px;align-items:end;margin-top:14px}.codebox>div{flex:1}.footer{margin:16px 0;text-align:center;color:#aa99bb;font-size:11px}.footer a{color:#d7c2ea}.loading{display:inline-block;width:16px;height:16px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:7px}.voice-field{display:flex;align-items:stretch;gap:7px}.voice-field>input,.voice-field>textarea{flex:1;min-width:0}.voice-button{flex:0 0 46px;width:46px;border:1px solid #80649a;background:#2c1d3d;color:#fff;border-radius:11px;cursor:pointer;font-size:21px;display:flex;align-items:center;justify-content:center;transition:.15s}.voice-button:hover,.voice-button:focus-visible{border-color:#f0d681;outline:2px solid #f0d681;outline-offset:2px}.voice-button.listening{background:#712d48;border-color:#ffb0c7;animation:voicePulse 1.1s ease-in-out infinite}.voice-button:disabled{opacity:.45;cursor:not-allowed}.voice-hint{margin-top:5px;color:#bcaacb;font-size:12px}.voice-error{margin-top:5px;color:#ffb6b6;font-size:12px}@keyframes voicePulse{50%{transform:scale(1.06);box-shadow:0 0 0 5px #ff8bac22}}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:600px){.app{padding:10px}.panel{padding:14px}.own-row{grid-template-columns:1fr}.card{flex-basis:118px}.card img{width:118px;height:189px}.backs{grid-template-columns:repeat(6,1fr)}.codebox{display:block}.codebox button{margin-top:8px;width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">Bertollo–Raisch Tarot</div><div class="sub">Deine Karten · direkt und privat in dieser Web-App gedeutet</div></div><button class="home" id="home">⌂ Startseite</button></div>
  <main class="panel" id="root" aria-live="polite"></main>
  <div class="footer">Anbieter: Bertollo · <a href="/privacy">Datenschutz</a> · <a href="/terms">Nutzungsbedingungen</a> · <a href="/support">Support</a> · <a href="/imprint">Impressum</a></div>
</div>
<script>
const layouts={
 daily:{title:'Tageskarte / Einkartenlegung',sub:'Ein Impuls für deinen Tag oder eine konkrete Frage',count:1,positions:['Tagesimpuls']},
 three:{title:'Drei-Karten-Legung',sub:'Ausgangslage · Gegenwart · Entwicklung',count:3,positions:['Ausgangslage oder Vergangenheit','Gegenwärtige Dynamik','Entwicklung oder Tendenz']},
 yesno:{title:'Ja/Nein-Frage',sub:'Drei Karten für eine vorsichtige Tendenz',count:3,positions:['Ausgangslage','Einfluss oder Hindernis','Entwicklungstendenz']},
 cross:{title:'Kleines Kreuz',sub:'Fünf Karten für Situation und Entwicklung',count:5,positions:['Gegenwärtige Situation','Herausforderung','Grundlage oder Vergangenheit','Bewusste Ausrichtung, Ziel oder Rat','Entwicklungstendenz']},
 celtic:{title:'Keltisches Kreuz',sub:'Zehn Karten für eine ausführliche Betrachtung',count:10,positions:['Ausgangslage','Herausforderung','Bewusste Ebene','Unbewusste Ebene oder verborgene Dynamik','Vergangenheit oder Einfluss','Nahe Zukunft','Eigene Haltung','Umfeld oder äußere Einflüsse','Hoffnungen und Befürchtungen','Wahrscheinliches Ergebnis']},
 own:{title:'Eigene Karten',sub:'Physisch gelegte Karten eingeben',count:3,positions:[]}
};
let CARDS=[];
const state={screen:'home',layout:null,question:'',drawn:[],mode:null,deck:[],selected:[],ownCount:3,ownCards:[],answer:null,followupInput:'',auth:{checked:false,required:true,authenticated:false,message:'',error:''}};
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loadCards(){const r=await fetch('/api/cards');if(!r.ok)throw new Error('Kartendeck konnte nicht geladen werden.');CARDS=(await r.json()).cards}
function reset(){Object.assign(state,{screen:'home',layout:null,question:'',drawn:[],mode:null,deck:[],selected:[],ownCount:3,ownCards:[],answer:null,followupInput:''});render()}
document.getElementById('home').onclick=reset;
function render(){let out;if(state.screen==='home')out=home();else if(state.layout==='own')out=own();else if(state.screen==='choose')out=choose();else out=reading();queueMicrotask(installVoiceInputs);return out}
function authBox(){
  const a=state.auth;
  if(!a.checked)return `<div class="auth-info" role="status"><span class="loading"></span>Zugang wird geprüft …</div>`;
  if(!a.required)return `<div class="auth-ok" role="status"><span>✓ Kein Familiencode erforderlich.</span></div>`;
  if(a.authenticated)return `<div class="auth-ok" role="status"><span>✓ ${esc(a.message||'Code wurde akzeptiert und ist gespeichert.')}</span><button class="small-button" id="changeCode">Code ändern</button></div>`;
  return `<form class="codebox" id="codeForm"><div><label class="label" for="familyCode">Familiencode</label><input id="familyCode" type="password" autocomplete="current-password" placeholder="Familiencode eingeben" required></div><button class="secondary" id="saveCode" type="submit">Code prüfen</button></form>${a.error?`<div class="auth-error" role="alert">${esc(a.error)}</div>`:''}`;
}
async function checkAuth(){
  try{
    const oldCode=localStorage.getItem('bertolloFamilyCode')||'';
    if(oldCode){
      const migrated=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({code:oldCode})});
      if(migrated.ok)localStorage.removeItem('bertolloFamilyCode');
    }
    const r=await fetch('/api/auth/status',{credentials:'same-origin',cache:'no-store'});
    if(!r.ok)throw new Error('Zugangsstatus konnte nicht geprüft werden.');
    const data=await r.json();
    Object.assign(state.auth,{checked:true,required:Boolean(data.required),authenticated:Boolean(data.authenticated),message:data.authenticated?'Code wurde akzeptiert und bleibt für zukünftige Besuche gespeichert.':'',error:''});
  }catch(e){Object.assign(state.auth,{checked:true,authenticated:false,error:e.message||'Die Zugangsprüfung ist fehlgeschlagen.'});}
}
function bindAuth(){
  const form=document.getElementById('codeForm');
  if(form)form.onsubmit=async e=>{
    e.preventDefault();
    const input=document.getElementById('familyCode');
    const button=document.getElementById('saveCode');
    const value=input.value.trim();
    if(!value){state.auth.error='Bitte gib den Familiencode ein.';home();return;}
    button.disabled=true;button.innerHTML='<span class="loading"></span>Wird geprüft …';state.auth.error='';
    try{
      const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({code:value})});
      const data=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(data.error||`Anmeldung fehlgeschlagen (HTTP ${r.status}).`);
      Object.assign(state.auth,{checked:true,required:Boolean(data.required),authenticated:true,message:data.message||'Code wurde akzeptiert und gespeichert.',error:''});
      home();
    }catch(err){state.auth.error=err.message||'Der Code konnte nicht geprüft werden.';home();document.getElementById('familyCode')?.focus();}
  };
  const change=document.getElementById('changeCode');
  if(change)change.onclick=async()=>{
    try{await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'});}catch{}
    Object.assign(state.auth,{checked:true,required:true,authenticated:false,message:'',error:''});home();document.getElementById('familyCode')?.focus();
  };
}
function home(){root.innerHTML=`<div class="notice">Wähle eine Legung. Du kannst automatisch ziehen oder verdeckte Karten selbst auswählen. Die Deutung erscheint direkt unter deinen Karten.</div>${authBox()}<div class="grid" style="margin-top:16px">${Object.entries(layouts).map(([k,v])=>`<button class="option" data-k="${k}"><b>${v.title}</b><span>${v.sub}</span></button>`).join('')}</div><div class="safety">Tarot dient Unterhaltung und Selbstreflexion. Es ist keine sichere Vorhersage und ersetzt keine medizinische, psychologische, rechtliche oder finanzielle Beratung.</div><div class="status" id="status"></div>`;bindAuth();root.querySelectorAll('.option').forEach(b=>b.onclick=()=>{state.layout=b.dataset.k;state.screen='reading';state.drawn=[];state.mode=null;state.answer=null;render()})}
function questionField(){return `<label class="label" for="q">Deine Frage oder dein Thema</label><textarea id="q" placeholder="Worum geht es bei dieser Legung?">${esc(state.question)}</textarea>`}
function readingToContext(r){if(!r)return '';return [r.subject,...(r.positions||[]).map(p=>`${p.number}. ${p.position} – ${p.card}: ${p.interpretation}`),r.summary,r.overall_analysis,r.assessment,r.key_message,r.essence].filter(Boolean).join('\n')}
function section(title,text,cls='reading-section'){return text?`<section class="${cls}"><h3>${esc(title)}</h3><p>${esc(text)}</p></section>`:''}
function renderAnswer(){const r=state.answer;if(!r)return '';const positions=(r.positions||[]).map(p=>`<article class="position-reading"><h4>Position ${esc(p.number)} – ${esc(p.position)}</h4><div><b>${esc(p.card)}</b></div><p>${esc(p.interpretation)}</p></article>`).join('');return `<div class="reading-head"><h3>Worum es geht</h3><p>${esc(r.subject)}</p></div>${positions}${section('Zusammenfassung',r.summary)}${section('Gesamtanalyse',r.overall_analysis)}${section('Einschätzung',r.assessment)}${section('Kernaussage',r.key_message)}${section('Essenz',r.essence,'essence')}${section('Reflexionsfrage',r.reflection_question)}<div class="followup-box"><h3>Sinnvolle Folgefrage</h3><div class="followup-suggestion">${esc(r.suggested_followup)}</div><div class="actions"><button class="primary" id="useFollowup" type="button">Diese Folgefrage auswerten</button></div><label class="label" for="customFollowup">Oder eigene Folgefrage</label><textarea id="customFollowup" placeholder="Eigene Folgefrage eingeben">${esc(state.followupInput)}</textarea><div class="actions"><button class="secondary" id="sendCustomFollowup" type="button">Eigene Folgefrage auswerten</button></div><div class="followup-note">Die Folgefrage wird anhand derselben Karten vertieft. Es werden keine neuen Karten gezogen.</div><div class="status" id="followupStatus"></div></div>`}
function bindAnswerActions(cards,title){if(!state.answer)return;const suggested=document.getElementById('useFollowup');if(suggested)suggested.onclick=()=>requestInterpretation(cards,title,state.answer.suggested_followup);const input=document.getElementById('customFollowup');if(input)input.oninput=e=>state.followupInput=e.target.value;const own=document.getElementById('sendCustomFollowup');if(own)own.onclick=()=>{const q=state.followupInput.trim();if(!q){const el=document.getElementById('followupStatus');if(el){el.className='status error';el.textContent='Bitte gib eine Folgefrage ein.'}return}requestInterpretation(cards,title,q)}}
function reading(){const l=layouts[state.layout];root.innerHTML=`<h2>${l.title}</h2><p class="sub">${l.sub}</p>${questionField()}${!state.drawn.length?`<div class="actions"><button class="primary" id="auto">Automatisch ziehen</button><button class="secondary" id="self">Verdeckt selbst auswählen</button></div>`:`<div class="actions"><button class="secondary" id="again">Neu ziehen</button><button class="primary" id="interpret">Legung deuten</button></div>`}<div id="cards"></div><div class="status" id="status"></div><div class="answer" id="answer">${renderAnswer()}</div>`;document.getElementById('q').oninput=e=>state.question=e.target.value;if(!state.drawn.length){document.getElementById('auto').onclick=autoDraw;document.getElementById('self').onclick=startChoose}else{document.getElementById('again').onclick=()=>{state.drawn=[];state.answer=null;render()};document.getElementById('interpret').onclick=interpret}showCards();bindAnswerActions(state.drawn,l.title)}
function shuffled(){const a=[...CARDS];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function autoDraw(){const l=layouts[state.layout],pool=shuffled();state.drawn=pool.slice(0,l.count).map((c,i)=>({...c,position:l.positions[i]}));state.answer=null;render()}
function startChoose(){state.deck=shuffled();state.selected=[];state.screen='choose';render()}
function choose(){const l=layouts[state.layout];root.innerHTML=`<h2>${l.title}: verdeckt auswählen</h2><p class="notice">Wähle ${l.count===1?'eine Karte':l.count+' unterschiedliche Karten'}. Ausgewählt: <b id="counter">${state.selected.length}/${l.count}</b></p><div class="backs">${Array.from({length:78},(_,i)=>`<button class="back ${state.selected.includes(i)?'selected':''}" data-i="${i}" aria-label="Verdeckte Karte ${i+1}">${i+1}</button>`).join('')}</div><div class="actions"><button class="primary" id="reveal" ${state.selected.length===l.count?'':'disabled'}>Karten aufdecken</button><button class="secondary" id="cancel">Abbrechen</button></div>`;root.querySelectorAll('.back').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ix=state.selected.indexOf(i);if(ix>=0)state.selected.splice(ix,1);else if(state.selected.length<l.count)state.selected.push(i);render()});document.getElementById('cancel').onclick=()=>{state.screen='reading';render()};document.getElementById('reveal').onclick=()=>{state.drawn=state.selected.map((deckIndex,i)=>({...state.deck[deckIndex],position:l.positions[i]}));state.screen='reading';state.answer=null;render()}}
function showCards(){const el=document.getElementById('cards');if(!el||!state.drawn.length)return;el.innerHTML=`<div class="cards">${state.drawn.map(c=>`<div class="card"><img src="${c.image_url}" alt="${esc(c.name)}" loading="lazy"><div class="card-name">${esc(c.position)}<br><b>${esc(c.name)}</b></div></div>`).join('')}</div>`}
function own(){state.ownCards=Array.from({length:state.ownCount},(_,i)=>state.ownCards[i]||{name:'',position:''});root.innerHTML=`<h2>Eigene Karten</h2><p class="sub">Gib deine physisch gelegten Karten ein. Alle Karten werden aufrecht gedeutet.</p>${questionField()}<label class="label" for="count">Anzahl der Karten (1–20)</label><input id="count" type="number" min="1" max="20" value="${state.ownCount}"><label class="label">Karten in Reihenfolge</label><div>${state.ownCards.map((c,i)=>`<div class="own-row"><input list="cardnames" data-i="${i}" value="${esc(c.name)}" placeholder="${i+1}. Karte"><input data-p="${i}" value="${esc(c.position)}" placeholder="Bedeutung der Position (optional)"></div>`).join('')}</div><datalist id="cardnames">${CARDS.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><div class="actions"><button class="primary" id="owninterpret">Legung deuten</button></div><div class="status" id="status"></div><div class="answer" id="answer">${renderAnswer()}</div>`;document.getElementById('q').oninput=e=>state.question=e.target.value;document.getElementById('count').onchange=e=>{state.ownCount=Math.max(1,Math.min(20,Number(e.target.value)||1));state.answer=null;render()};root.querySelectorAll('[data-i]').forEach(x=>x.oninput=e=>state.ownCards[+e.target.dataset.i].name=e.target.value);root.querySelectorAll('[data-p]').forEach(x=>x.oninput=e=>state.ownCards[+e.target.dataset.p].position=e.target.value);document.getElementById('owninterpret').onclick=interpretOwn;bindAnswerActions(state.ownCards.map((c,i)=>({name:c.name.trim(),position:c.position.trim()||`Position ${i+1}`})),'Eigene physische Legung')}
function setStatus(t,error=false){const s=document.getElementById('status');if(s){s.className='status'+(error?' error':'');s.innerHTML=t}}
async function requestInterpretation(cards,title,followupQuestion=''){const btn=followupQuestion?(document.getElementById('useFollowup')||document.getElementById('sendCustomFollowup')):(document.getElementById('interpret')||document.getElementById('owninterpret'));if(btn)btn.disabled=true;const target=followupQuestion?document.getElementById('followupStatus'):document.getElementById('status');if(target){target.className='status';target.innerHTML='<span class="loading"></span>'+(followupQuestion?'Die Folgefrage wird ausgewertet …':'Die Legung wird gedeutet …')}const previous=state.answer;const payload={spread:state.layout||'own',spread_title:title,question:state.question.trim(),cards:cards.map((c,i)=>({position:c.position||`Position ${i+1}`,name:c.name})),followup_question:followupQuestion,previous_reading:readingToContext(previous)};try{const r=await fetch('/api/interpret',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(payload)});const data=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401){Object.assign(state.auth,{checked:true,required:true,authenticated:false,message:'',error:'Deine gespeicherte Anmeldung ist nicht mehr gültig. Bitte gib den Familiencode erneut ein.'});throw new Error('Der Familiencode fehlt, ist falsch oder die gespeicherte Anmeldung ist abgelaufen.')}throw new Error(data.error||`Die Deutung ist fehlgeschlagen (HTTP ${r.status}).`)}state.answer=data.reading||null;state.followupInput='';render();document.getElementById('answer')?.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){const el=followupQuestion?document.getElementById('followupStatus'):document.getElementById('status');if(el){el.className='status error';el.textContent=e.message||String(e)}if(btn)btn.disabled=false}}
function interpret(){requestInterpretation(state.drawn,layouts[state.layout].title)}
function interpretOwn(){const validNames=new Set(CARDS.map(c=>c.name.toLowerCase()));const cards=state.ownCards.map((c,i)=>({name:c.name.trim(),position:c.position.trim()||`Position ${i+1}`}));if(cards.some(c=>!c.name)){setStatus('Bitte alle Kartennamen eintragen.',true);return}const invalid=cards.filter(c=>!validNames.has(c.name.toLowerCase()));if(invalid.length){setStatus('Unbekannte Karte: '+invalid.map(c=>esc(c.name)).join(', '),true);return}requestInterpretation(cards,'Eigene physische Legung')}
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
const isFirefox=/firefox/i.test(navigator.userAgent);
let activeRecognition=null;
let activeRecorder=null;
let activeRecorderButton=null;
let activeRecorderTimer=null;
function voiceErrorText(code){return ({'not-allowed':'Mikrofonzugriff wurde blockiert. Setze die Mikrofonberechtigung für diese Website einmal zurück oder auf „Zulassen“.','service-not-allowed':'Die Spracheingabe ist in diesem Browser oder durch das Betriebssystem nicht freigegeben.','no-speech':'Es wurde keine Sprache erkannt. Bitte versuche es erneut.','audio-capture':'Es wurde kein verfügbares Mikrofon gefunden.','network':'Die Spracherkennung konnte den Sprachdienst nicht erreichen.','aborted':'Spracheingabe wurde beendet.'})[code]||'Die Spracheingabe konnte nicht gestartet werden.'}
function showVoiceMessage(button,text,isError=true){const wrap=button.closest('.voice-field');let msg=wrap?.nextElementSibling;if(!msg||!msg.classList.contains('voice-feedback')){msg=document.createElement('div');msg.className='voice-feedback';wrap?.insertAdjacentElement('afterend',msg)}msg.className='voice-feedback '+(isError?'voice-error':'voice-hint');msg.textContent=text;if(!isError)setTimeout(()=>{if(msg?.isConnected)msg.remove()},4500)}
async function requestMicrophonePermission(button){
  if(!window.isSecureContext){showVoiceMessage(button,'Mikrofonzugriff ist nur über eine sichere HTTPS-Adresse möglich.');return false}
  if(!navigator.mediaDevices?.getUserMedia){showVoiceMessage(button,'Dieser Browser kann den Mikrofonzugriff nicht aktiv anfordern.');return false}
  try{
    if(window.top!==window.self){showVoiceMessage(button,'Die App läuft in einem eingebetteten Fenster. Öffne sie direkt unter '+location.origin+'.');return false}
    showVoiceMessage(button,'Bitte bestätige jetzt den Mikrofonzugriff im Browserdialog.',false);
    return await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})
  }catch(error){
    const name=error?.name||'';
    if(name==='NotAllowedError'||name==='PermissionDeniedError')showVoiceMessage(button,'Der Mikrofonzugriff wurde abgelehnt oder ist bereits blockiert. Die App kann eine gespeicherte Blockierung nicht selbst aufheben.');
    else if(name==='NotFoundError'||name==='DevicesNotFoundError')showVoiceMessage(button,'Es wurde kein Mikrofon gefunden.');
    else if(name==='NotReadableError'||name==='TrackStartError')showVoiceMessage(button,'Das Mikrofon wird möglicherweise gerade von einer anderen App verwendet.');
    else showVoiceMessage(button,'Der Mikrofonzugriff konnte nicht angefordert werden: '+(error?.message||name||'unbekannter Fehler'));
    return false
  }
}
function setVoiceButtonIdle(button){button.disabled=false;button.classList.remove('listening');button.setAttribute('aria-pressed','false');button.title='Text per Sprache eingeben';button.textContent='🎤'}
function appendTranscribedText(field,text){const existing=field.value.trimEnd();field.value=existing+(existing&&text?' ':'')+text.trim();field.dispatchEvent(new Event('input',{bubbles:true}));field.focus()}
function preferredRecorderMimeType(){const options=['audio/ogg;codecs=opus','audio/webm;codecs=opus','audio/webm','audio/mp4'];return options.find(t=>window.MediaRecorder?.isTypeSupported?.(t))||''}
async function startFirefoxTranscription(field,button){
  if(!window.MediaRecorder){showVoiceMessage(button,'Firefox kann auf diesem Gerät keine Audioaufnahme starten.');return}
  if(activeRecorder){try{activeRecorder.stop()}catch{}return}
  button.disabled=true;button.textContent='…';button.title='Mikrofonberechtigung wird geprüft';
  const stream=await requestMicrophonePermission(button);
  if(!stream){setVoiceButtonIdle(button);return}
  const mimeType=preferredRecorderMimeType();
  let recorder;
  try{recorder=mimeType?new MediaRecorder(stream,{mimeType}):new MediaRecorder(stream)}catch(e){stream.getTracks().forEach(t=>t.stop());setVoiceButtonIdle(button);showVoiceMessage(button,'Die Audioaufnahme konnte nicht gestartet werden: '+(e?.message||'unbekannter Fehler'));return}
  const chunks=[];activeRecorder=recorder;activeRecorderButton=button;
  button.disabled=false;button.classList.add('listening');button.setAttribute('aria-pressed','true');button.title='Aufnahme beenden';button.textContent='■';field.focus();
  showVoiceMessage(button,'Firefox-Aufnahme läuft. Zum Beenden erneut auf ■ tippen.',false);
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  recorder.onerror=e=>showVoiceMessage(button,'Bei der Audioaufnahme ist ein Fehler aufgetreten: '+(e?.error?.message||'unbekannter Fehler'));
  recorder.onstop=async()=>{
    if(activeRecorderTimer){clearTimeout(activeRecorderTimer);activeRecorderTimer=null}
    stream.getTracks().forEach(t=>t.stop());activeRecorder=null;activeRecorderButton=null;
    button.disabled=true;button.classList.remove('listening');button.textContent='…';button.title='Sprache wird in Text umgewandelt';
    if(!chunks.length){setVoiceButtonIdle(button);showVoiceMessage(button,'Es wurden keine Audiodaten aufgenommen.');return}
    const blob=new Blob(chunks,{type:recorder.mimeType||mimeType||'audio/webm'});
    try{
      const r=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':blob.type||'audio/webm'},credentials:'same-origin',body:blob});
      const data=await r.json().catch(()=>({}));
      if(!r.ok){if(r.status===401)throw new Error('Die Familiencode-Anmeldung ist abgelaufen. Bitte melde dich erneut an.');throw new Error(data.error||`Transkription fehlgeschlagen (HTTP ${r.status}).`)}
      if(!data.text)throw new Error('Es wurde kein verständlicher Text erkannt.');
      appendTranscribedText(field,data.text);showVoiceMessage(button,'Sprache wurde übernommen.',false)
    }catch(e){showVoiceMessage(button,e?.message||String(e))}finally{setVoiceButtonIdle(button)}
  };
  recorder.start(250);
  activeRecorderTimer=setTimeout(()=>{if(activeRecorder&&activeRecorder.state==='recording'){showVoiceMessage(button,'Die maximale Aufnahmezeit von 60 Sekunden wurde erreicht.',false);activeRecorder.stop()}},60000)
}
async function startBrowserSpeechRecognition(field,button){
  if(!SpeechRecognition){showVoiceMessage(button,'Die direkte Spracheingabe wird von diesem Browser nicht unterstützt. Nutze Chrome oder Edge; Firefox verwendet automatisch die serverseitige Transkription.');return}
  if(activeRecognition){try{activeRecognition.abort()}catch{}activeRecognition=null}
  button.disabled=true;button.textContent='…';button.title='Mikrofonberechtigung wird geprüft';
  const permissionStream=await requestMicrophonePermission(button);
  button.disabled=false;button.textContent='🎤';button.title='Text per Sprache eingeben';
  if(!permissionStream)return;
  const stopPermissionStream=()=>{try{permissionStream.getTracks().forEach(track=>track.stop())}catch{}};
  const recognition=new SpeechRecognition();activeRecognition=recognition;recognition.lang='de-DE';recognition.interimResults=true;recognition.continuous=false;recognition.maxAlternatives=1;
  const original=field.value.trimEnd();let finalText='';
  button.classList.add('listening');button.setAttribute('aria-pressed','true');button.title='Aufnahme beenden';button.textContent='■';field.focus();
  recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const text=e.results[i][0].transcript.trim();if(e.results[i].isFinal)finalText+=(finalText?' ':'')+text;else interim+=(interim?' ':'')+text}const spoken=[finalText,interim].filter(Boolean).join(' ');field.value=original+(original&&spoken?' ':'')+spoken;field.dispatchEvent(new Event('input',{bubbles:true}))};
  recognition.onstart=()=>stopPermissionStream();
  recognition.onerror=e=>{stopPermissionStream();if(e.error!=='aborted'){const detail=e.error==='not-allowed'?'Der Mikrofonzugriff selbst wurde erlaubt, aber der Browser-Spracherkennungsdienst hat die Spracheingabe abgelehnt.':voiceErrorText(e.error);showVoiceMessage(button,detail)}};
  recognition.onend=()=>{stopPermissionStream();setVoiceButtonIdle(button);if(activeRecognition===recognition)activeRecognition=null;if(finalText)showVoiceMessage(button,'Sprache wurde übernommen.',false)};
  try{recognition.start()}catch(e){stopPermissionStream();showVoiceMessage(button,'Das Mikrofon wurde freigegeben, aber die Spracherkennung konnte nicht gestartet werden: '+(e?.message||'unbekannter Fehler'));recognition.onend()}
}
async function startVoiceInput(field,button){
  if(isFirefox)return startFirefoxTranscription(field,button);
  return startBrowserSpeechRecognition(field,button)
}
function stopActiveVoice(button){
  if(activeRecorder&&button===activeRecorderButton){try{activeRecorder.stop()}catch{}return true}
  if(activeRecognition&&button.classList.contains('listening')){try{activeRecognition.stop()}catch{}return true}
  return false
}
function installVoiceInputs(){
  document.querySelectorAll('#root textarea,#root input').forEach(field=>{
    const type=(field.getAttribute('type')||'text').toLowerCase();
    if(field.dataset.voiceReady||field.disabled||field.readOnly||['password','number','checkbox','radio','hidden','file','date','time','email','url'].includes(type))return;
    field.dataset.voiceReady='1';const wrap=document.createElement('div');wrap.className='voice-field';field.parentNode.insertBefore(wrap,field);wrap.appendChild(field);
    const button=document.createElement('button');button.type='button';button.className='voice-button';button.textContent='🎤';button.title='Text per Sprache eingeben';button.setAttribute('aria-label','Text per Sprache in dieses Feld eingeben');button.setAttribute('aria-pressed','false');button.onclick=()=>{if(stopActiveVoice(button))return;startVoiceInput(field,button)};wrap.appendChild(button)
  })
}
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);setStatus('Unerwarteter Fehler: '+esc(e.reason?.message||String(e.reason)),true)});
window.addEventListener('error',e=>{console.error(e.error||e.message);setStatus('Unerwarteter Programmfehler. Bitte lade die Seite neu.',true)});
(async()=>{try{await Promise.all([loadCards(),checkAuth()]);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})}catch(e){root.innerHTML=`<p class="error">${esc(e.message)}</p>`}})();
</script>
