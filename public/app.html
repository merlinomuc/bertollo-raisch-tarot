<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#180f27">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/logo.svg">
<title>Bertollo–Raisch Tarot</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#f7f0ff;background:#0d0814;line-height:1.5}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#432568 0,#181022 46%,#09060e 100%)}button,input,textarea{font:inherit}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:clamp(24px,5vw,42px)/1.1 Georgia,serif}.sub{color:#cdbdde;font-size:13px}.home{border:1px solid #765b91;background:#251837;color:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.panel{margin-top:18px;background:rgba(24,14,38,.94);border:1px solid #4e3868;border-radius:20px;padding:18px;box-shadow:0 18px 50px #0008}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.option{border:1px solid #624779;background:linear-gradient(145deg,#302044,#21152f);color:#fff;border-radius:16px;padding:18px;text-align:left;cursor:pointer;min-height:120px}.option:hover,.option:focus-visible{transform:translateY(-2px);border-color:#d2b0ef;outline:2px solid #f0d681;outline-offset:2px}.option b{display:block;font-size:17px;margin-bottom:7px}.option span{color:#cbb9dd;font-size:13px}.label{display:block;margin:13px 0 6px;color:#eadcf7;font-weight:700}textarea,input{width:100%;border:1px solid #655078;background:#120c1b;color:#fff;border-radius:11px;padding:11px}textarea{min-height:90px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.primary,.secondary{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:#f0d681;color:#281b05}.secondary{background:#38264d;color:#fff;border:1px solid #665078}.primary:disabled,.secondary:disabled{opacity:.5;cursor:not-allowed}.cards{display:flex;gap:12px;overflow:auto;padding:15px 2px 8px;scroll-snap-type:x mandatory}.card{flex:0 0 148px;scroll-snap-align:start;text-align:center}.card img{width:148px;height:237px;object-fit:cover;border-radius:11px;border:2px solid #a887c7;box-shadow:0 10px 24px #0008}.card-name{font-size:12px;margin-top:7px}.backs{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;margin-top:14px}.back{aspect-ratio:2/3;border-radius:9px;border:2px solid #8267a0;background:radial-gradient(circle,#64447e 0 8%,transparent 9%),linear-gradient(135deg,#221333,#53366d,#21122f);color:#fff;cursor:pointer;font-weight:800;box-shadow:inset 0 0 0 3px #1a1026}.back.selected{border-color:#f0d681;box-shadow:0 0 0 3px #f0d68155,inset 0 0 0 3px #1a1026}.notice,.safety{padding:11px 13px;border-radius:12px;background:#2b2135;color:#ddd0e8;font-size:13px}.safety{margin-top:14px;border:1px solid #59456c;background:#1c1328}.status{margin-top:12px;color:#f0d681;font-size:14px}.answer{margin-top:18px;border-top:1px solid #59456c;padding-top:18px;white-space:pre-wrap;color:#f6effc}.answer h3{font-family:Georgia,serif;font-size:24px}.error{color:#ffb6b6}.own-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.codebox{display:flex;gap:8px;align-items:end;margin-top:14px}.codebox>div{flex:1}.footer{margin:16px 0;text-align:center;color:#aa99bb;font-size:11px}.footer a{color:#d7c2ea}.loading{display:inline-block;width:16px;height:16px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:600px){.app{padding:10px}.panel{padding:14px}.own-row{grid-template-columns:1fr}.card{flex-basis:118px}.card img{width:118px;height:189px}.backs{grid-template-columns:repeat(6,1fr)}.codebox{display:block}.codebox button{margin-top:8px;width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">Bertollo–Raisch Tarot</div><div class="sub">Deine Karten · direkt und privat in dieser Web-App gedeutet</div></div><button class="home" id="home">⌂ Startseite</button></div>
  <main class="panel" id="root" aria-live="polite"></main>
  <div class="footer">Anbieter: Bertollo · <a href="/privacy">Datenschutz</a> · <a href="/terms">Nutzungsbedingungen</a> · <a href="/support">Support</a> · <a href="/imprint">Impressum</a></div>
</div>
<script>
const layouts={
 daily:{title:'Tageskarte / Einkartenlegung',sub:'Ein Impuls für deinen Tag oder eine konkrete Frage',count:1,positions:['Tagesimpuls']},
 three:{title:'Drei-Karten-Legung',sub:'Ausgangslage · Gegenwart · Entwicklung',count:3,positions:['Ausgangslage oder Vergangenheit','Gegenwärtige Dynamik','Entwicklung oder Tendenz']},
 yesno:{title:'Ja/Nein-Frage',sub:'Drei Karten für eine vorsichtige Tendenz',count:3,positions:['Ausgangslage','Einfluss oder Hindernis','Entwicklungstendenz']},
 cross:{title:'Kleines Kreuz',sub:'Fünf Karten für Situation und Entwicklung',count:5,positions:['Gegenwärtige Situation','Herausforderung','Grundlage oder Vergangenheit','Bewusste Ausrichtung, Ziel oder Rat','Entwicklungstendenz']},
 celtic:{title:'Keltisches Kreuz',sub:'Zehn Karten für eine ausführliche Betrachtung',count:10,positions:['Ausgangslage','Herausforderung','Bewusste Ebene','Unbewusste Ebene oder verborgene Dynamik','Vergangenheit oder Einfluss','Nahe Zukunft','Eigene Haltung','Umfeld oder äußere Einflüsse','Hoffnungen und Befürchtungen','Wahrscheinliches Ergebnis']},
 own:{title:'Eigene Karten',sub:'Physisch gelegte Karten eingeben',count:3,positions:[]}
};
let CARDS=[];
const state={screen:'home',layout:null,question:'',drawn:[],mode:null,deck:[],selected:[],ownCount:3,ownCards:[],answer:''};
const root=document.getElementById('root');
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const code=()=>localStorage.getItem('bertolloFamilyCode')||'';
async function loadCards(){const r=await fetch('/api/cards');if(!r.ok)throw new Error('Kartendeck konnte nicht geladen werden.');CARDS=(await r.json()).cards}
function reset(){Object.assign(state,{screen:'home',layout:null,question:'',drawn:[],mode:null,deck:[],selected:[],ownCount:3,ownCards:[],answer:''});render()}
document.getElementById('home').onclick=reset;
function render(){if(state.screen==='home')return home();if(state.layout==='own')return own();if(state.screen==='choose')return choose();return reading()}
function authBox(){return `<div class="codebox"><div><label class="label" for="familyCode">Familiencode</label><input id="familyCode" type="password" autocomplete="current-password" value="${esc(code())}" placeholder="Nur erforderlich, wenn eingerichtet"></div><button class="secondary" id="saveCode">Code speichern</button></div>`}
function bindAuth(){const b=document.getElementById('saveCode');if(b)b.onclick=()=>{localStorage.setItem('bertolloFamilyCode',document.getElementById('familyCode').value);setStatus('Familiencode gespeichert.')}}
function home(){root.innerHTML=`<div class="notice">Wähle eine Legung. Du kannst automatisch ziehen oder verdeckte Karten selbst auswählen. Die Deutung erscheint direkt unter deinen Karten.</div>${authBox()}<div class="grid" style="margin-top:16px">${Object.entries(layouts).map(([k,v])=>`<button class="option" data-k="${k}"><b>${v.title}</b><span>${v.sub}</span></button>`).join('')}</div><div class="safety">Tarot dient Unterhaltung und Selbstreflexion. Es ist keine sichere Vorhersage und ersetzt keine medizinische, psychologische, rechtliche oder finanzielle Beratung.</div><div class="status" id="status"></div>`;bindAuth();root.querySelectorAll('.option').forEach(b=>b.onclick=()=>{state.layout=b.dataset.k;state.screen='reading';state.drawn=[];state.mode=null;state.answer='';render()})}
function questionField(){return `<label class="label" for="q">Deine Frage oder dein Thema</label><textarea id="q" placeholder="Worum geht es bei dieser Legung?">${esc(state.question)}</textarea>`}
function reading(){const l=layouts[state.layout];root.innerHTML=`<h2>${l.title}</h2><p class="sub">${l.sub}</p>${questionField()}${!state.drawn.length?`<div class="actions"><button class="primary" id="auto">Automatisch ziehen</button><button class="secondary" id="self">Verdeckt selbst auswählen</button></div>`:`<div class="actions"><button class="secondary" id="again">Neu ziehen</button><button class="primary" id="interpret">Legung deuten</button></div>`}<div id="cards"></div><div class="status" id="status"></div><div class="answer" id="answer">${esc(state.answer)}</div>`;document.getElementById('q').oninput=e=>state.question=e.target.value;if(!state.drawn.length){document.getElementById('auto').onclick=autoDraw;document.getElementById('self').onclick=startChoose}else{document.getElementById('again').onclick=()=>{state.drawn=[];state.answer='';render()};document.getElementById('interpret').onclick=interpret}showCards()}
function shuffled(){const a=[...CARDS];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function autoDraw(){const l=layouts[state.layout],pool=shuffled();state.drawn=pool.slice(0,l.count).map((c,i)=>({...c,position:l.positions[i]}));state.answer='';render()}
function startChoose(){state.deck=shuffled();state.selected=[];state.screen='choose';render()}
function choose(){const l=layouts[state.layout];root.innerHTML=`<h2>${l.title}: verdeckt auswählen</h2><p class="notice">Wähle ${l.count===1?'eine Karte':l.count+' unterschiedliche Karten'}. Ausgewählt: <b id="counter">${state.selected.length}/${l.count}</b></p><div class="backs">${Array.from({length:78},(_,i)=>`<button class="back ${state.selected.includes(i)?'selected':''}" data-i="${i}" aria-label="Verdeckte Karte ${i+1}">${i+1}</button>`).join('')}</div><div class="actions"><button class="primary" id="reveal" ${state.selected.length===l.count?'':'disabled'}>Karten aufdecken</button><button class="secondary" id="cancel">Abbrechen</button></div>`;root.querySelectorAll('.back').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,ix=state.selected.indexOf(i);if(ix>=0)state.selected.splice(ix,1);else if(state.selected.length<l.count)state.selected.push(i);render()});document.getElementById('cancel').onclick=()=>{state.screen='reading';render()};document.getElementById('reveal').onclick=()=>{state.drawn=state.selected.map((deckIndex,i)=>({...state.deck[deckIndex],position:l.positions[i]}));state.screen='reading';state.answer='';render()}}
function showCards(){const el=document.getElementById('cards');if(!el||!state.drawn.length)return;el.innerHTML=`<div class="cards">${state.drawn.map(c=>`<div class="card"><img src="${c.image_url}" alt="${esc(c.name)}" loading="lazy"><div class="card-name">${esc(c.position)}<br><b>${esc(c.name)}</b></div></div>`).join('')}</div>`}
function own(){state.ownCards=Array.from({length:state.ownCount},(_,i)=>state.ownCards[i]||{name:'',position:''});root.innerHTML=`<h2>Eigene Karten</h2><p class="sub">Gib deine physisch gelegten Karten ein. Alle Karten werden aufrecht gedeutet.</p>${questionField()}<label class="label" for="count">Anzahl der Karten (1–20)</label><input id="count" type="number" min="1" max="20" value="${state.ownCount}"><label class="label">Karten in Reihenfolge</label><div>${state.ownCards.map((c,i)=>`<div class="own-row"><input list="cardnames" data-i="${i}" value="${esc(c.name)}" placeholder="${i+1}. Karte"><input data-p="${i}" value="${esc(c.position)}" placeholder="Bedeutung der Position (optional)"></div>`).join('')}</div><datalist id="cardnames">${CARDS.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><div class="actions"><button class="primary" id="owninterpret">Legung deuten</button></div><div class="status" id="status"></div><div class="answer" id="answer">${esc(state.answer)}</div>`;document.getElementById('q').oninput=e=>state.question=e.target.value;document.getElementById('count').onchange=e=>{state.ownCount=Math.max(1,Math.min(20,Number(e.target.value)||1));state.answer='';render()};root.querySelectorAll('[data-i]').forEach(x=>x.oninput=e=>state.ownCards[+e.target.dataset.i].name=e.target.value);root.querySelectorAll('[data-p]').forEach(x=>x.oninput=e=>state.ownCards[+e.target.dataset.p].position=e.target.value);document.getElementById('owninterpret').onclick=interpretOwn}
function setStatus(t,error=false){const s=document.getElementById('status');if(s){s.className='status'+(error?' error':'');s.innerHTML=t}}
async function requestInterpretation(cards,title){const btn=document.getElementById('interpret')||document.getElementById('owninterpret');if(btn)btn.disabled=true;setStatus('<span class="loading"></span>Die Legung wird gedeutet …');state.answer='';const payload={spread:state.layout||'own',spread_title:title,question:state.question.trim(),cards:cards.map((c,i)=>({position:c.position||`Position ${i+1}`,name:c.name}))};try{const r=await fetch('/api/interpret',{method:'POST',headers:{'Content-Type':'application/json','X-Family-Code':code()},body:JSON.stringify(payload)});const data=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)throw new Error('Der Familiencode fehlt oder ist falsch. Speichere ihn auf der Startseite.');throw new Error(data.error||'Die Deutung ist fehlgeschlagen.')}state.answer=data.interpretation||'';render();document.getElementById('answer')?.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){setStatus(esc(e.message||String(e)),true);if(btn)btn.disabled=false}}
function interpret(){requestInterpretation(state.drawn,layouts[state.layout].title)}
function interpretOwn(){const validNames=new Set(CARDS.map(c=>c.name.toLowerCase()));const cards=state.ownCards.map((c,i)=>({name:c.name.trim(),position:c.position.trim()||`Position ${i+1}`}));if(cards.some(c=>!c.name)){setStatus('Bitte alle Kartennamen eintragen.',true);return}const invalid=cards.filter(c=>!validNames.has(c.name.toLowerCase()));if(invalid.length){setStatus('Unbekannte Karte: '+invalid.map(c=>esc(c.name)).join(', '),true);return}requestInterpretation(cards,'Eigene physische Legung')}
(async()=>{try{await loadCards();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})}catch(e){root.innerHTML=`<p class="error">${esc(e.message)}</p>`}})();
</script>
</body>
</html>
