n-width:94px;border:0;background:transparent;color:#a99e88;padding:8px 11px;border-radius:12px;cursor:pointer}.bottom-nav button.active,.bottom-nav button:hover{color:var(--gold2);background:#1a1913}.bottom-nav span{display:block;font-size:18px}.section-intro{text-align:center;max-width:700px;margin:0 auto 16px;color:#bfb5a2}
.settings-list{display:grid;gap:14px}.setting-card,.history-item,.more-link{border:1px solid #4d3d20;background:linear-gradient(145deg,#161816,#0d0f0e);border-radius:14px;padding:15px}.setting-card h3,.history-item h3{margin:0 0 6px;color:var(--gold2);font-family:Georgia,serif}.setting-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,220px);align-items:center;gap:14px}.setting-row>div{min-width:0}.setting-row select{width:100%;min-width:0;max-width:100%;border:1px solid #66522a;background:#0b0d0d;color:#fff8e8;border-radius:10px;padding:9px}.toggle{display:flex;align-items:center;gap:9px}.toggle input{width:auto}.history-list{display:grid;gap:12px}.history-meta{font-size:12px;color:#a99e88}.history-cards{font-size:12px;color:#d1c4aa;margin-top:6px}.history-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.empty-state{text-align:center;padding:30px 15px;color:#bdb39f}.more-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.more-link{display:block;color:#f5ecd7;text-decoration:none}.more-link b{display:block;color:var(--gold2);margin-bottom:4px}.danger{border-color:#7a3838;color:#ffb7ad}.app.font-large{font-size:112%}.app.reduce-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}.local-note{font-size:12px;color:#a99e88;margin-top:8px}.badge{display:inline-block;padding:3px 8px;border:1px solid #66522a;border-radius:999px;color:#e6cf93;font-size:11px}

@media(max-width:700px){.app{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}.panel{padding:15px;border-radius:19px}.settings-list,.setting-card{min-width:0}.setting-row{grid-template-columns:1fr;align-items:stretch}.setting-row select,.setting-row .toggle{width:100%;max-width:100%}.toggle{justify-content:flex-start}.bottom-nav{left:10px;right:10px;transform:none;width:auto;max-width:calc(100vw - 20px);justify-content:space-around}.bottom-nav button{min-width:0;flex:1;padding:8px 4px;font-size:12px}.own-spread-select{grid-template-columns:repeat(2,minmax(0,1fr))}.codebox{display:block}.codebox button{margin-top:8px;width:100%}}

<body>
<div class="app">
  <div class="top"><div class="brand-wrap"><div class="brand-mark">☾ ✦ ☽</div><div class="brand">Bertollo–Raisch Tarot</div><div class="sub">Klarheit · Intuition · Erkenntnis</div></div><button class="home" id="home">✦ Startseite</button></div>
  <main class="panel" id="root" aria-live="polite"></main>
  <div class="footer">Anbieter: Bertollo · <a href="/privacy">Datenschutz</a> · <a href="/terms">Nutzungsbedingungen</a> · <a href="/support">Support</a> · <a href="/imprint">Impressum</a></div>
</div>
<nav class="bottom-nav" aria-label="Hauptnavigation"><button id="navHome" class="active"><span>✦</span>Start</button><button id="navReadings"><span>▱</span>Legungen</button><button id="navSettings"><span>⚙</span>Einstellungen</button><button id="navMore"><span>☾</span>Mehr</button></nav>
<script>
const layoutIcons={daily:'☀',three:'▱',yesno:'☾?',cross:'✥',celtic:'✣',own:'✋'};
const layouts={
 daily:{title:'Tageskarte / Einkartenlegung',sub:'Ein Impuls für deinen Tag oder eine konkrete Frage',count:1,positions:['Tagesimpuls']},
 three:{title:'Drei-Karten-Legung',sub:'Ausgangslage · Gegenwart · Entwicklung',count:3,positions:['Ausgangslage oder Vergangenheit','Gegenwärtige Dynamik','Entwicklung oder Tendenz']},
 yesno:{title:'Ja/Nein-Frage',sub:'Drei Karten für eine vorsichtige Tendenz',count:3,positions:['Ausgangslage','Einfluss oder Hindernis','Entwicklungstendenz']},
 cross:{title:'Kleines Kreuz',sub:'Fünf Karten für Situation und Entwicklung',count:5,positions:['Gegenwärtige Situation','Herausforderung','Grundlage oder Vergangenheit','Bewusste Ausrichtung, Ziel oder Rat','Entwicklungstendenz']},
 celtic:{title:'Keltisches Kreuz',sub:'Zehn Karten für eine ausführliche Betrachtung',count:10,positions:['Ausgangslage','Herausforderung','Bewusste Ebene','Unbewusste Ebene oder verborgene Dynamik','Vergangenheit oder Einfluss','Nahe Zukunft','Eigene Haltung','Umfeld oder äußere Einflüsse','Hoffnungen und Befürchtungen','Wahrscheinliches Ergebnis']},
 own:{title:'Eigene Karten',sub:'Physisch gelegte Karten eingeben',count:3,positions:[]}
};
let CARDS=[];
const state={screen:'home',layout:null,question:'',drawn:[],mode:null,deck:[],selected:[],ownCount:3,ownCards:[],ownType:'three',ownText:'',answer:null,followupInput:'',currentHistoryId:null,auth:{checked:false,required:true,authenticated:false,message:'',error:''}};
const root=document.getElementById('root');
const SETTINGS_KEY='bertollo_tarot_settings_v1';
const HISTORY_KEY='bertollo_tarot_history_v1';
const defaultSettings={responseLength:'medium',drawMode:'ask',saveHistory:true,maxHistory:30,fontSize:'normal',reduceMotion:false};
let settings=loadSettings();
function loadSettings(){try{return {...defaultSettings,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch{return {...defaultSettings}}}
function saveSettings(){localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));applySettings()}
function getHistory(){try{const v=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');return Array.isArray(v)?v:[]}catch{return []}}
function setHistory(items){localStorage.setItem(HISTORY_KEY,JSON.stringify(items.slice(0,Math.max(1,Number(settings.maxHistory)||30))))}
function applySettings(){const app=document.querySelector('.app');if(!app)return;app.classList.toggle('font-large',settings.fontSize==='large');app.classList.toggle('reduce-motion',Boolean(settings.reduceMotion))}
function updateNav(active){['navHome','navReadings','navSettings','navMore'].forEach(id=>document.getElementById(id)?.classList.toggle('active',id===active))}
function saveReadingLocally(title,cards,reading){if(!settings.saveHistory||!reading)return null;const items=getHistory();const entry={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),createdAt:new Date().toISOString(),spread:state.layout||'own',title,question:state.question.trim(),cards:cards.map(c=>({name:c.name,position:c.position})),reading,followups:[]};items.unshift(entry);setHistory(items);return entry.id}
function saveFollowupLocally(question,reading){if(!settings.saveHistory||!state.currentHistoryId||!reading)return;const items=getHistory();const item=items.find(x=>x.id===state.currentHistoryId);if(!item)return;item.followups=Array.isArray(item.followups)?item.followups:[];item.followups.push({createdAt:new Date().toISOString(),question,reading});setHistory(items)}
function formatLocalDate(value){try{return new Intl.DateTimeFormat('de-DE',{dateStyle:'medium',timeStyle:'short'}).format(new Date(value))}catch{return value}}
const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function loadCards(){const r=await fetch('/api/cards');if(!r.ok)throw new Error('Kartendeck konnte nicht geladen werden.');CARDS=(await r.json()).cards}
function reset(){updateNav('navHome');Object.assign(state,{screen:'home',layout:null,question:'',drawn:[],mode:null,deck:[],selected:[],ownCount:3,ownCards:[],ownType:'three',ownText:'',answer:null,followupInput:'',currentHistoryId:null});render()}
document.getElementById('home').onclick=reset;
document.getElementById('navHome').onclick=reset;
document.getElementById('navReadings').onclick=()=>{state.screen='history';render()};
document.getElementById('navSettings').onclick=()=>{state.screen='settings';render()};
document.getElementById('navMore').onclick=()=>{state.screen='more';render()};
function render(){let out;if(state.screen==='history')out=historyScreen();else if(state.screen==='settings')out=settingsScreen();else if(state.screen==='more')out=moreScreen();else if(state.screen==='history-detail')out=historyDetail();else if(state.screen==='home')out=home();else if(state.layout==='own')out=own();else if(state.screen==='choose')out=choose();else out=reading();applySettings();queueMicrotask(installVoiceInputs);return out}
function authBox(){
  const a=state.auth;
  if(!a.checked)return `<div class="auth-info" role="status"><span class="loading"></span>Zugang wird geprüft …</div>`;
  if(!a.required)return `<div class="auth-ok" role="status"><span>✓ Kein Familiencode erforderlich.</span></div>`;
  if(a.authenticated)return `<div class="auth-ok" role="status"><span>✓ ${esc(a.message||'Code wurde akzeptiert und ist gespeichert.')}</span><button class="small-button" id="changeCode">Code ändern</button></div>`;
  return `<form class="codebox" id="codeForm"><div><label class="label" for="familyCode">Familiencode</label><input id="familyCode" type="password" autocomplete="current-password" placeholder="Familiencode eingeben" required></div><button class="secondary" id="saveCode" type="submit">Code prüfen</button></form>${a.error?`<div class="auth-error" role="alert">${esc(a.error)}</div>`:''}`;
}
async function checkAuth(){
  try{
    const oldCode=localStorage.getItem('bertolloFamilyCode')||'';
    if(oldCode){
      const migrated=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({code:oldCode})});
      if(migrated.ok)localStorage.removeItem('bertolloFamilyCode');
    }
    const r=await fetch('/api/auth/status',{credentials:'same-origin',cache:'no-store'});
    if(!r.ok)throw new Error('Zugangsstatus konnte nicht geprüft werden.');
    const data=await r.json();
    Object.assign(state.auth,{checked:true,required:Boolean(data.required),authenticated:Boolean(data.authenticated),message:data.authenticated?'Code wurde akzeptiert und bleibt für zukünftige Besuche gespeichert.':'',error:''});
  }catch(e){Object.assign(state.auth,{checked:true,authenticated:false,error:e.message||'Die Zugangsprüfung ist fehlgeschlagen.'});}
}
function bindAuth(){
  const form=document.getElementById('codeForm');
  if(form)form.onsubmit=async e=>{
    e.preventDefault();
    const input=document.getElementById('familyCode');
    const button=document.getElementById('saveCode');
    const value=input.value.trim();
    if(!value){state.auth.error='Bitte gib den Familiencode ein.';home();return;}
    button.disabled=true;button.innerHTML='<span class="loading"></span>Wird geprüft …';state.auth.error='';
    try{
      const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({code:value})});
      const data=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(data.error||`Anmeldung fehlgeschlagen (HTTP ${r.status}).`);
      Object.assign(state.auth,{checked:true,required:Boolean(data.required),authenticated:true,message:data.message||'Code wurde akzeptiert und gespeichert.',error:''});
      home();
    }catch(err){state.auth.error=err.message||'Der Code konnte nicht geprüft werden.';home();document.getElementById('familyCode')?.focus();}
  };
  const change=document.getElementById('changeCode');
  if(change)change.onclick=async()=>{

  setVoiceButtonListening(button);field.focus();startVoiceMeter(stream,button);
  showVoiceMessage(button,'Sprache wird erkannt. Zum Beenden erneut auf die Wellen tippen.',false);
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  recorder.onerror=e=>showVoiceMessage(button,'Bei der Audioaufnahme ist ein Fehler aufgetreten: '+(e?.error?.message||'unbekannter Fehler'));
  recorder.onstop=async()=>{
    if(activeRecorderTimer){clearTimeout(activeRecorderTimer);activeRecorderTimer=null}
    stopVoiceMeter();stream.getTracks().forEach(t=>t.stop());activeRecorder=null;activeRecorderButton=null;
    button.disabled=true;button.classList.remove('listening');button.textContent='…';button.title='Sprache wird in Text umgewandelt';
    if(!chunks.length){setVoiceButtonIdle(button);showVoiceMessage(button,'Es wurden keine Audiodaten aufgenommen.');return}
    const blob=new Blob(chunks,{type:recorder.mimeType||mimeType||'audio/webm'});
    try{
      const r=await fetch('/api/transcribe',{method:'POST',headers:{'Content-Type':blob.type||'audio/webm'},credentials:'same-origin',body:blob});
      const data=await r.json().catch(()=>({}));
      if(!r.ok){if(r.status===401)throw new Error('Die Familiencode-Anmeldung ist abgelaufen. Bitte melde dich erneut an.');throw new Error(data.error||`Transkription fehlgeschlagen (HTTP ${r.status}).`)}
      if(!data.text)throw new Error('Es wurde kein verständlicher Text erkannt.');
      appendTranscribedText(field,data.text);showVoiceMessage(button,'Sprache wurde übernommen.',false)
    }catch(e){showVoiceMessage(button,e?.message||String(e))}finally{setVoiceButtonIdle(button)}
  };
  recorder.start(250);
  activeRecorderTimer=setTimeout(()=>{if(activeRecorder&&activeRecorder.state==='recording'){showVoiceMessage(button,'Die maximale Aufnahmezeit von 60 Sekunden wurde erreicht.',false);activeRecorder.stop()}},60000)
}
async function startBrowserSpeechRecognition(field,button){
  if(!SpeechRecognition){showVoiceMessage(button,'Die direkte Spracheingabe wird von diesem Browser nicht unterstützt. Es wird auf diesem Gerät keine passende Sprachfunktion angeboten.');return}
  if(activeRecognition){try{activeRecognition.abort()}catch{}activeRecognition=null}
  button.disabled=true;button.textContent='…';button.title='Mikrofonberechtigung wird geprüft';
  const permissionStream=await requestMicrophonePermission(button);
  button.disabled=false;button.textContent='🎤';button.title='Text per Sprache eingeben';
  if(!permissionStream)return;
  const stopPermissionStream=()=>{try{permissionStream.getTracks().forEach(track=>track.stop())}catch{}};
  const recognition=new SpeechRecognition();activeRecognition=recognition;recognition.lang='de-DE';recognition.interimResults=true;recognition.continuous=false;recognition.maxAlternatives=1;
  const original=field.value.trimEnd();let finalText='';
  setVoiceButtonListening(button);field.focus();startVoiceMeter(permissionStream,button);showVoiceMessage(button,'Sprache wird erkannt. Zum Beenden erneut auf die Wellen tippen.',false);
  recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const text=e.results[i][0].transcript.trim();if(e.results[i].isFinal)finalText+=(finalText?' ':'')+text;else interim+=(interim?' ':'')+text}const spoken=[finalText,interim].filter(Boolean).join(' ');field.value=original+(original&&spoken?' ':'')+spoken;field.dispatchEvent(new Event('input',{bubbles:true}))};
  recognition.onstart=()=>{};
  recognition.onerror=e=>{stopVoiceMeter();stopPermissionStream();if(e.error!=='aborted'){const detail=e.error==='not-allowed'?'Der Mikrofonzugriff selbst wurde erlaubt, aber der Browser-Spracherkennungsdienst hat die Spracheingabe abgelehnt.':voiceErrorText(e.error);showVoiceMessage(button,detail)}};
  recognition.onend=()=>{stopVoiceMeter();stopPermissionStream();setVoiceButtonIdle(button);if(activeRecognition===recognition)activeRecognition=null;if(finalText)showVoiceMessage(button,'Sprache wurde übernommen.',false)};
  try{recognition.start()}catch(e){stopVoiceMeter();stopPermissionStream();showVoiceMessage(button,'Das Mikrofon wurde freigegeben, aber die Spracherkennung konnte nicht gestartet werden: '+(e?.message||'unbekannter Fehler'));recognition.onend()}
}
async function startVoiceInput(field,button){
  if(useServerTranscription)return startServerTranscription(field,button);
  return startBrowserSpeechRecognition(field,button)
}
function stopActiveVoice(button){
  if(activeRecorder&&button===activeRecorderButton){try{activeRecorder.stop()}catch{}return true}
  if(activeRecognition&&button.classList.contains('listening')){try{activeRecognition.stop()}catch{}return true}
  return false
}
function installVoiceInputs(){
  document.querySelectorAll('#root textarea,#root input').forEach(field=>{
    const type=(field.getAttribute('type')||'text').toLowerCase();
    if(field.dataset.voiceReady||field.disabled||field.readOnly||['password','number','checkbox','radio','hidden','file','date','time','email','url'].includes(type))return;
    field.dataset.voiceReady='1';const wrap=document.createElement('div');wrap.className='voice-field';field.parentNode.insertBefore(wrap,field);wrap.appendChild(field);
    const button=document.createElement('button');button.type='button';button.className='voice-button';button.textContent='🎤';button.title='Text per Sprache eingeben';button.setAttribute('aria-label','Text per Sprache in dieses Feld eingeben');button.setAttribute('aria-pressed','false');button.onclick=()=>{if(stopActiveVoice(button))return;startVoiceInput(field,button)};wrap.appendChild(button)
  })
}
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);setStatus('Unerwarteter Fehler: '+esc(e.reason?.message||String(e.reason)),true)});
window.addEventListener('error',e=>{console.error(e.error||e.message);setStatus('Unerwarteter Programmfehler. Bitte lade die Seite neu.',true)});
(async()=>{try{await Promise.all([loadCards(),checkAuth()]);render();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{})}catch(e){root.innerHTML=`<p class="error">${esc(e.message)}</p>`}})();
</script>
