const layouts={
 daily:{title:'Tageskarte',sub:'Eine Karte als Impuls für den Tag',count:1,positions:['Tagesimpuls']},
 yesno:{title:'Ja / Nein',sub:'Drei Karten für eine klare Tendenz',count:3,positions:['Ausgangslage','Kernthema','Tendenz']},
 cross:{title:'Kleines Kreuz',sub:'Fünf Karten für Situation und nächsten Schritt',count:5,positions:['Gegenwart','Herausforderung','Grundlage','Mögliches Ziel','Nahe Zukunft']},
 celtic:{title:'Keltisches Kreuz',sub:'Zehn Karten für eine ausführliche Betrachtung',count:10,positions:['Situation','Herausforderung','Unbewusste Grundlage','Vergangenheit','Bewusstes Ziel','Nahe Zukunft','Eigene Haltung','Umfeld','Hoffnungen und Ängste','Entwicklungstendenz']},
 own:{title:'Eigene Karten',sub:'Physisch gelegte Karten eingeben',count:3,positions:[]}
};
let state={screen:'home',layout:null,question:'',drawn:[],ownCount:3,ownCards:[]};
const root=document.getElementById('root');
document.getElementById('home').onclick=()=>{state={screen:'home',layout:null,question:'',drawn:[],ownCount:3,ownCards:[]};render()};
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){if(state.screen==='home')return home(); if(state.layout==='own')return own(); return reading();}
function home(){root.innerHTML=`<div class="notice">Wähle eine Legung. Die Karten werden hier gezogen; die Deutung übernimmt anschließend ChatGPT im Konto der Person, die die App benutzt.</div><div class="grid" style="margin-top:14px">${Object.entries(layouts).map(([k,v])=>`<button class="option" data-k="${k}"><b>${v.title}</b><span>${v.sub}</span></button>`).join('')}</div>`;root.querySelectorAll('.option').forEach(b=>b.onclick=()=>{state.layout=b.dataset.k;state.screen='reading';state.drawn=[];render()})}
function questionField(){return `<label class="label">Deine Frage oder dein Thema</label><textarea id="q" placeholder="Worum geht es bei dieser Legung?">${esc(state.question)}</textarea>`}
function reading(){const l=layouts[state.layout];root.innerHTML=`<h2>${l.title}</h2><p class="sub">${l.sub}</p>${questionField()}<div class="actions"><button class="primary" id="draw">${state.drawn.length?'Neu ziehen':'Karten ziehen'}</button>${state.drawn.length?'<button class="secondary" id="interpret">Von ChatGPT deuten lassen</button>':''}</div><div id="cards"></div><div class="status" id="status"></div>`;document.getElementById('q').oninput=e=>state.question=e.target.value;document.getElementById('draw').onclick=drawCards;if(state.drawn.length)document.getElementById('interpret').onclick=sendReading;showCards()}
function drawCards(){const l=layouts[state.layout];const pool=[...CARDS];state.drawn=[];for(let i=0;i<l.count;i++){const x=pool.splice(Math.floor(Math.random()*pool.length),1)[0];state.drawn.push({...x,reversed:Math.random()<.35,position:l.positions[i]})}render()}
function showCards(){const el=document.getElementById('cards');if(!el||!state.drawn.length)return;el.innerHTML=`<div class="cards">${state.drawn.map(c=>`<div class="card ${c.reversed?'reversed':''}"><img src="${c.img}" alt="${esc(c.name)}"><div class="card-name">${esc(c.position)}<br><b>${esc(c.name)}</b></div><span class="badge">${c.reversed?'umgekehrt':'aufrecht'}</span></div>`).join('')}</div>`}
function own(){state.ownCards=Array.from({length:state.ownCount},(_,i)=>state.ownCards[i]||{name:'',orientation:'aufrecht'});root.innerHTML=`<h2>Eigene Karten</h2><p class="sub">Gib die Karten ein, die du mit deinem physischen Deck gelegt hast.</p>${questionField()}<label class="label">Anzahl der Karten (1–20)</label><input id="count" type="number" min="1" max="20" value="${state.ownCount}"><label class="label">Karten in ausgelegter Reihenfolge</label><div id="ownrows">${state.ownCards.map((c,i)=>`<div class="own-row"><input list="cardnames" data-i="${i}" value="${esc(c.name)}" placeholder="${i+1}. Karte"><select data-o="${i}"><option ${c.orientation==='aufrecht'?'selected':''}>aufrecht</option><option ${c.orientation==='umgekehrt'?'selected':''}>umgekehrt</option></select></div>`).join('')}</div><datalist id="cardnames">${CARDS.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist><div class="actions"><button class="primary" id="owninterpret">Von ChatGPT deuten lassen</button></div><div class="status" id="status"></div>`;document.getElementById('q').oninput=e=>state.question=e.target.value;document.getElementById('count').onchange=e=>{state.ownCount=Math.max(1,Math.min(20,Number(e.target.value)||1));render()};root.querySelectorAll('[data-i]').forEach(x=>x.oninput=e=>state.ownCards[+e.target.dataset.i].name=e.target.value);root.querySelectorAll('[data-o]').forEach(x=>x.onchange=e=>state.ownCards[+e.target.dataset.o].orientation=e.target.value);document.getElementById('owninterpret').onclick=sendOwn}
function promptFor(cards,layoutTitle){return `Du bist Bertollo–Raisch Tarot. Deute respektvoll, psychologisch reflektiert und nicht-deterministisch auf Deutsch. Stelle nichts als sichere Vorhersage dar.\n\nLegung: ${layoutTitle}\nFrage/Thema: ${state.question||'kein spezielles Thema'}\nKarten:\n${cards.map((c,i)=>`${i+1}. ${c.position?c.position+': ':''}${c.name} – ${c.reversed||c.orientation==='umgekehrt'?'umgekehrt':'aufrecht'}`).join('\n')}\n\nDeute zuerst jede Position, dann das Zusammenspiel. Schließe mit Kernaussage, hilfreichem nächsten Schritt und einer Reflexionsfrage.`}
async function sendMessage(prompt){const s=document.getElementById('status');s.textContent='Übergabe an ChatGPT …';try{if(window.openai?.sendFollowUpMessage){await window.openai.sendFollowUpMessage({prompt});s.textContent='Die Legung wurde an den Chat übergeben.'}else{await navigator.clipboard.writeText(prompt);s.textContent='ChatGPT-Verbindung nicht erkannt. Der Deutungstext wurde in die Zwischenablage kopiert.'}}catch(e){s.textContent='Übergabe fehlgeschlagen: '+(e?.message||e)}}
function sendReading(){sendMessage(promptFor(state.drawn,layouts[state.layout].title))}
function sendOwn(){const cards=state.ownCards.map((c,i)=>({...c,position:`Position ${i+1}`}));if(cards.some(c=>!c.name.trim())){document.getElementById('status').textContent='Bitte alle Kartennamen eintragen.';return}sendMessage(promptFor(cards,'Eigene physische Legung'))}
render();
</script></body></html>
